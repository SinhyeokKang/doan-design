name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Under workflow_call, github.workflow is the caller's name, so a caller's
  # gate does not share (and get cancelled from) the push-triggered CI run's
  # group; the `-ci-` part keeps it apart from the caller's own group.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  # Cancelling on develop/main pushes would leave a merged commit's result as
  # "cancelled" when several PRs merge back to back.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No display name on this job: the branch protection required check is the
  # job id `gate`, and a display name would replace it.
  gate:
    runs-on: macos-26
    # About twice the measured job time (7 min on macos-26).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm --prefix app ci
      - run: node .agents/skills/verify/scripts/verify.mjs
