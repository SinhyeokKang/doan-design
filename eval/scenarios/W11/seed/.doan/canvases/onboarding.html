<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="onboarding">
  <meta name="doan:width" content="1300">
  <title>Onboarding</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <style>
    body { font-family: system-ui, sans-serif; color: var(--color-text); background: var(--color-surface); display: flex; align-items: flex-start; gap: var(--space-4); }
    [data-doan-frame] { box-sizing: border-box; padding: var(--space-4); border-radius: var(--radius); display: flex; flex-direction: column; gap: var(--space-4); }
    .phone { width: 390px; height: 844px; }
    label { display: flex; flex-direction: column; gap: 4px; }
    button { background: var(--color-primary); color: var(--color-surface); padding: var(--space-4); border: 0; border-radius: var(--radius); }
  </style>
</head>
<body>
<p>Design proposal — these screens are not implemented in code.</p>
<section class="phone" data-doan-frame="welcome" data-doan-title="Welcome" data-doan-prototype="390x844">
<h1 data-doan-id="welcome-heading">Welcome</h1>
<p data-doan-id="welcome-copy">Plan your week with your team in one place.</p>
<button data-doan-id="welcome-action" type="button">Create an account</button>
</section>
<section class="phone" data-doan-frame="signup" data-doan-title="Sign up" data-doan-prototype="390x844">
<h1 data-doan-id="signup-heading">Create your account</h1>
<label>Email <input data-doan-id="signup-email" type="email"></label>
<label>Password <input data-doan-id="signup-password" type="password"></label>
<button data-doan-id="signup-action" type="button">Sign up</button>
<button data-doan-id="signup-back" type="button">Back to welcome</button>
</section>
<section class="phone" data-doan-frame="done" data-doan-title="Done" data-doan-prototype="390x844">
<h1 data-doan-id="done-heading">You are ready</h1>
<p data-doan-id="done-copy">Your account is ready to use.</p>
<button data-doan-id="done-back" type="button">Back to sign up</button>
</section>
</body>
</html>
