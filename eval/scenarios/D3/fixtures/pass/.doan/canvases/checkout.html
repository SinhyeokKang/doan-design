<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="checkout">
  <meta name="doan:width" content="1200">
  <title>Checkout</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { margin: 0; padding: var(--space-6); font-family: var(--font-body); font-size: var(--type-body-size); color: var(--color-text); background: var(--color-surface-muted); }
    main { display: flex; gap: var(--space-6); align-items: flex-start; }
    [data-doan-frame] { width: 420px; padding: var(--space-6); background: var(--color-surface); border-radius: var(--radius); }
    h1 { margin: 0 0 var(--space-4); font-size: var(--type-title-size); }
    label { display: block; margin-top: var(--space-4); }
    input { display: block; width: 100%; box-sizing: border-box; padding: var(--space-2); border: 1px solid var(--color-text-muted); border-radius: var(--radius); }
    .error { margin: var(--space-2) 0 0; color: var(--color-danger); }
    button { width: 100%; margin-top: var(--space-6); padding: var(--space-4); border: 0; border-radius: var(--radius); background: var(--color-primary); color: var(--color-surface); }
    dl { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); }
  </style>
</head>
<body>
<p>Design proposal: this checkout is not implemented in code yet.</p>
<main>
<section data-doan-frame="payment" data-doan-title="Checkout — payment">
<h1 data-doan-id="payment-heading">Pay invoice #1042</h1>
<label data-doan-id="card-label">Card number <input data-doan-id="card-input" value="4000 0000 0000 0002"></label>
<p class="error" data-doan-id="card-error">Your card was declined. Try another card or contact your bank.</p>
<label data-doan-id="zip-label">ZIP code <input data-doan-id="zip-input" value="1234"></label>
<p class="error" data-doan-id="zip-error">Enter the 5-digit ZIP code from your billing address.</p>
<button data-doan-id="pay-button" type="button">Submit</button>
</section>
<section data-doan-frame="summary" data-doan-title="Checkout — summary">
<h1 data-doan-id="summary-heading">Invoice #1042</h1>
<dl data-doan-id="summary-lines"><dt>Logo design</dt><dd>$480.00</dd><dt>Total</dt><dd>$480.00</dd></dl>
</section>
</main>
</body>
</html>
