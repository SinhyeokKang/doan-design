<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="typography">
  <meta name="doan:width" content="1600">
  <title>Typography</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { margin: 0; padding: var(--space-6); font-family: var(--font-body); font-size: var(--type-body-size); color: var(--color-text); background: var(--color-surface-muted); }
    main { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: flex-start; }
    [data-doan-frame] { width: 440px; padding: var(--space-6); background: var(--color-surface); border-radius: var(--radius); }
    h1 { margin: 0 0 var(--space-4); font-size: var(--type-title-size); }
  </style>
</head>
<body>
<p>Typography reference for Ledgerly, based on styles/tokens.css. Sample text is placeholder copy; the rules are in DESIGN.md.</p>
<main>
<section data-doan-frame="typography" data-doan-title="Typography" data-doan-implements="styles/tokens.css">
<h1 data-doan-id="typography-heading">Typography</h1>
<p data-doan-id="type-title" style="font-size: var(--type-title-size)">Card title <code>--type-title-size</code></p>
<p data-doan-id="type-body" style="font-size: var(--type-body-size)">Button and input text. <code>--type-body-size</code>; components inherit the font (<code>--font-body</code> is defined, not referenced)</p>
</section>
</main></body></html>
