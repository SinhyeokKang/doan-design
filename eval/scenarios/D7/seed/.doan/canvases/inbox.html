<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="inbox">
  <meta name="doan:width" content="1600">
  <title>Inbox</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { margin: 0; padding: var(--space-6); font-family: var(--font-body); font-size: var(--type-body-size); color: var(--color-text); background: var(--color-surface-muted); }
    main { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: flex-start; }
    [data-doan-frame] { width: 420px; padding: var(--space-6); background: var(--color-surface); border-radius: var(--radius); }
    h1 { margin: 0 0 var(--space-4); font-size: var(--type-title-size); }
    ul { margin: 0; padding: 0; list-style: none; }
    li { padding: var(--space-2) 0; border-bottom: 1px solid var(--color-surface-muted); }
    .meta { color: var(--color-text-muted); }
    .error { color: var(--color-danger); }
    button { margin-top: var(--space-4); padding: var(--space-2) var(--space-4); border: 0; border-radius: var(--radius); background: var(--color-primary); color: var(--color-surface); }
  </style>
</head>
<body>
<p>Design proposal: the client inbox is not implemented in code yet.</p>
<main>
<section data-doan-frame="inbox" data-doan-title="Inbox — messages">
<h1 data-doan-id="inbox-heading">Client messages</h1>
<ul data-doan-id="message-list">
<li>Studio North <span class="meta">Can we split invoice #1042?</span></li>
<li>Maple Bakery <span class="meta">Paid, thank you.</span></li>
<li>Orbit Labs <span class="meta">Updated PO number attached.</span></li>
</ul>
</section>
<section data-doan-frame="inbox-error" data-doan-title="Inbox — error">
<h1 data-doan-id="inbox-error-heading">Client messages</h1>
<p class="error" data-doan-id="inbox-error-message">Something happened.</p>
<button data-doan-id="inbox-error-action" type="button">OK</button>
</section>
</main>
</body>
</html>
