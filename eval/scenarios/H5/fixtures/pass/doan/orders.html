<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="order-status">
  <meta name="doan:width" content="1400">
  <title>Order status</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    body { font-family: system-ui, sans-serif; color: var(--color-text); background: var(--color-surface); }
    main { display: flex; flex-wrap: wrap; gap: 32px; }
    [data-doan-frame] { width: 420px; padding: var(--space-4); border: 1px solid var(--color-text); border-radius: var(--radius); }
    li { display: flex; justify-content: space-between; align-items: center; margin: var(--space-4) 0; }
    .status-badge {
      display: inline-block;
      padding: var(--space-4);
      border-radius: var(--radius);
      font-weight: 600;
      background: var(--color-surface);
    }
    .status-badge--shipped { color: var(--color-success); border: 1px solid var(--color-success); }
    .status-badge--delayed { color: var(--color-warning); border: 1px solid var(--color-warning); }
    .status-badge--cancelled { color: var(--color-error); border: 1px solid var(--color-error); }
  </style>
</head>
<body>
<p>Design proposal — this screen is not implemented in code.</p>
<main>
<section data-doan-frame="order-list" data-doan-title="Orders — status list">
<h1>Orders</h1>
<ul>
<li>Order #1042 <span class="status-badge status-badge--shipped">Shipped</span></li>
<li>Order #1043 <span class="status-badge status-badge--delayed">Delayed</span></li>
<li>Order #1044 <span class="status-badge status-badge--cancelled">Cancelled</span></li>
</ul>
</section>
</main>
</body>
</html>
