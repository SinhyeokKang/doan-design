<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="profile-settings">
  <meta name="doan:width" content="2400">
  <title>Profile settings</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { font-family: system-ui, sans-serif; color: var(--color-text); background: var(--color-surface); }
    main { display: flex; flex-wrap: wrap; gap: 32px; }
    [data-doan-frame] { width: 420px; padding: var(--space-4); border: 1px solid var(--color-text); border-radius: var(--radius); }
    label { display: block; margin: var(--space-4) 0; }
    button { background: var(--color-primary); color: var(--color-surface); padding: var(--space-4); }
  </style>
</head>
<body>
<p>Design proposal — these screens are not implemented in code.</p>
<main>
<section data-doan-frame="profile-saved" data-doan-title="Profile — saved">
<h1>Profile settings</h1><form><label>Name <input value="Alex Morgan"></label><label>Email <input type="email" value="alex@example.com"></label><button type="button">Save profile</button></form>
<p role="status" style="color: var(--color-success)">Profile saved.</p>
</section>
<section data-doan-frame="profile-error" data-doan-title="Profile — validation error">
<h1>Profile settings</h1><form><label>Name <input value="Alex Morgan"></label><label>Email <input type="email" value="alex" aria-invalid="true" aria-describedby="email-error"></label><p id="email-error" style="color: #b42318">Enter a valid email address.</p><button type="button">Save profile</button></form>
</section>
</main>
</body>
</html>
