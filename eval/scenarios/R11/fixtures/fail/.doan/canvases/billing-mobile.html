<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="billing-mobile">
  <meta name="doan:width" content="390">
  <title>Billing (mobile)</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { margin: 0; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); background: var(--color-surface); color: var(--color-text); font: 16px/1.5 var(--font-body); }
    [data-doan-frame] { box-sizing: border-box; width: 100%; padding: var(--space-4); background: var(--color-panel); }
    h1 { margin: 0 0 var(--space-2); font-size: 24px; line-height: 32px; }
    p { margin: 0 0 var(--space-4); }
    button { font: inherit; padding: var(--space-2) var(--space-4); border: 0; background: var(--color-muted); color: var(--color-text); }
  </style>
</head>
<body>
  <section data-doan-frame="billing-form" data-doan-title="Billing">
    <h1 data-doan-id="billing-title">Billing</h1>
    <p data-doan-id="billing-note">Invoices are sent on the first of each month.</p>
    <button data-doan-id="update-card">Update card</button>
  </section>
</body>
</html>
