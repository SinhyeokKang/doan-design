<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="doan:canvas" content="projects">
  <meta name="doan:width" content="2400">
  <title>Projects</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <style>
    body { font-family: system-ui, sans-serif; color: var(--color-text); background: var(--color-surface); }
    main { display: flex; flex-wrap: wrap; gap: 32px; }
    [data-doan-frame] { width: 420px; padding: var(--space-4); border: 1px solid var(--color-text); border-radius: var(--radius); }
    label { display: block; margin: var(--space-4) 0; }
    button { background: var(--color-primary); color: var(--color-surface); padding: var(--space-4); }
  </style>
</head>
<body>
<p>Design proposal — these screens are not implemented in code.</p>
<main>
<section data-doan-frame="projects-list" data-doan-title="Projects — list">
<h1 data-doan-id="projects-heading">Projects</h1>
<ul><li>Website refresh</li><li>Mobile onboarding</li></ul>
<button data-doan-id="new-project" type="button">New project</button>
</section>
<section data-doan-frame="project-details" data-doan-title="Project — details">
<h1 data-doan-id="detail-heading">Website refresh</h1>
<p data-doan-id="project-owner">Owner: Alex Morgan</p>
</section>
</main>
</body>
</html>
