<h2>Spinner</h2>
<div class="dsc-row" style="align-items: center"><div class="dsc-cell"><span class="doan-spinner"></span><span class="dsc-label">alone</span></div><div class="dsc-cell"><p style="display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-subtle)"><span class="doan-spinner"></span>Reading</p><span class="dsc-label">beside its sentence (Project Settings)</span></div></div>
</section>
