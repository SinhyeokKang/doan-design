<body>
<main class="dsc">
<header class="dsc-head"><h1>panel</h1><p><code>.doan-panel</code>: the rounded, opaque sheet a screen is laid on (<code>--radius-container</code>, <code>--surface-panel</code>, <code>--shadow-panel</code>). It draws no content; the screen decides what goes inside. The text and padding below are canvas content.</p></header>
<section class="dsc-frame" data-doan-frame="panel" data-doan-title="Panel on the shell" data-doan-implements="app/src/renderer/ds/surfaces.css">
<h2>Panel on the shell</h2>
<div style="padding: var(--space-6); border-radius: var(--radius-row); background: var(--bg-app)"><div class="doan-panel" style="padding: var(--space-6)">Content of the screen</div></div>
</section>
</main>
</body>
</html>
